<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Enterprise Risk Dashboard – Plan FINAL</title>

<link rel="stylesheet" href="styles.css">

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- PapaParse -->
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body { margin:0; font-family: Arial, sans-serif; background:#f3f4f6; }
  .layout { display:flex; min-height:100vh; }
  .content { flex:1; padding:24px; background:white; }

  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { border:1px solid #ddd; padding:8px; vertical-align:top; }
  th { background:#e5e7eb; text-align:center; }

  select, button { padding:6px 10px; margin-right:8px; }
  .toolbar { margin-bottom:12px; }
</style>

</head>

<body>

<div id="root"></div>

<script>
const e = React.createElement;

/* ==================== Data Hook ==================== */
function usePlanData() {
  const [rows, setRows] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    const sheetId = "1J5MfU5JTDEazsGPEesa7u2oR-wRPI4wr8e5APKglEyw";

    const url =
      "https://docs.google.com/spreadsheets/d/" + sheetId +
      "/export?format=csv&sheet=Plan";

    fetch(url)
      .then(res => res.text())
      .then(csv => {
        const parsed = Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
        });

        setRows(parsed.data);
        setLoading(false);
      })
      .catch(err => {
        console.error(err);
        setLoading(false);
      });

  }, []);

  return { rows, loading };
}

/* ==================== App ==================== */
function App() {
  const { rows, loading } = usePlanData();

  const [rfFilter, setRfFilter] = React.useState("ALL");
  const [selectedPlan, setSelectedPlan] = React.useState(null);
  const [quarter, setQuarter] = React.useState("Q1");

  const rfList = React.useMemo(() => {
    const setRF = new Set(rows.map(r => r.RF_GroupName));
    return ["ALL"].concat(Array.from(setRF));
  }, [rows]);

  const planGroups = React.useMemo(() => {
    const map = {};
    rows.forEach(r => {
      if (rfFilter !== "ALL" && r.RF_GroupName !== rfFilter) return;
      if (!map[r.PlanName]) map[r.PlanName] = [];
      map[r.PlanName].push(r);
    });
    return map;
  }, [rows, rfFilter]);

  const detailKey = quarter + "_Detail";
  const problemKey = quarter + "_Problem";
  const solutionKey = quarter + "_Solution";

  /* ==================== UI ==================== */

  if (loading) {
    return e("div", { className:"layout" },
      e("div", { className:"content" }, "กำลังโหลดข้อมูล…")
    );
  }

  if (!selectedPlan) {
    return e("div", { className:"layout" },
      e("div", { className:"content" },

        e("h2", null, "Plan Report"),

        e("div", { className:"toolbar" },
          "RF Group: ",
          e("select", {
            value: rfFilter,
            onChange: (ev) => setRfFilter(ev.target.value)
          },
            rfList.map(rf =>
              e("option", { key: rf }, rf)
            )
          )
        ),

        e("table", null,
          e("thead", null,
            e("tr", null,
              e("th", null, "แผนงาน"),
              e("th", null, "RF"),
              e("th", null, "สถานะ")
            )
          ),
          e("tbody", null,
            Object.entries(planGroups).map(([planName, items]) => {
              const p = items[0];
              return e("tr", {
                  key: planName,
                  style: { cursor:"pointer" },
                  onClick: () => setSelectedPlan({ name: planName, items })
                },
                e("td", null, planName),
                e("td", { style:{ textAlign:"center" } }, p.RF_GroupName),
                e("td", null, p.Status_Combined)
              );
            })
          )
        )

      )
    );
  }

  /* ================= Drill-down ================= */

  return e("div", { className:"layout" },
    e("div", { className:"content" },

      e("button", { onClick: () => setSelectedPlan(null) }, "← กลับ"),

      e("h3", null, selectedPlan.name),

      e("div", { className:"toolbar" },
        "ไตรมาส: ",
        ["Q1","Q2","Q3","Q4"].map(q =>
          e("button", {
            key:q,
            onClick: () => setQuarter(q),
            style: { fontWeight: quarter===q ? "bold" : "normal" }
          }, q)
        )
      ),

      e("table", null,
        e("thead", null,
          e("tr", null,
            e("th", null, "ลำดับ"),
            e("th", null, "กิจกรรม"),
            e("th", null, "รายละเอียด"),
            e("th", null, "ปัญหา"),
            e("th", null, "แนวทาง")
          )
        ),
        e("tbody", null,
          selectedPlan.items.map((a, i) =>
            e("tr", { key:i },
              e("td", null, a.ActivityOrder),
              e("td", null, a.ActivityName),
              e("td", null, a[detailKey]),
              e("td", null, a[problemKey]),
              e("td", null, a[solutionKey])
            )
          )
        )
      )

    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  e(App)
);
</script>

</body>
</html>
